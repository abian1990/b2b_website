# Cloudflare Pages + Functions
name = "b2b-website"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Local `wrangler pages dev` uses these. Pages Production/Preview still need
# the same binding in Dashboard → Settings → Functions → KV namespace bindings.
[[kv_namespaces]]
binding = "QUOTES_KV"
id = "428d2176c72d44bb83cc70a43e84359d"
preview_id = "f553d4e921884e45a189d7930c09dad1"

[vars]
# Non-secret config can go here; put secrets in Dashboard Secrets / wrangler pages secret
# ALLOWED_ORIGINS = "https://www.zzsky.com,http://localhost:5173"
# EMAIL_FROM = "ZZSKY Quote <noreply@your-verified-domain.com>"
# NOTIFY_EMAIL = "wudapeng135@gmail.com"
# CUSTOMER_AUTO_REPLY = "true"
# RATE_LIMIT = "5"
# AI chat (LLM_API_KEY must be a Secret, not a var)
# LLM_BASE_URL = "https://api.deepseek.com"
# LLM_MODEL = "deepseek-flash"
# CHAT_RATE_LIMIT = "30"
