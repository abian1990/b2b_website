<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ZZSKY Quotes Export</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #0f172a; }
    h1 { font-size: 1.35rem; }
    label { display: block; font-size: 0.875rem; margin: 16px 0 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 16px; margin-right: 8px; padding: 10px 16px; border: 0; border-radius: 8px; background: #e11d48; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #0f172a; }
    .hint { color: #64748b; font-size: 0.85rem; margin-top: 8px; }
    .err { color: #b91c1c; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>询价记录导出</h1>
  <p class="hint">使用 Cloudflare 配置的 <code>ADMIN_API_KEY</code>。此页仅方便内部下载，请勿公开分享链接。</p>
  <label for="key">Admin API Key</label>
  <input id="key" type="password" placeholder="ADMIN_API_KEY" autocomplete="off" />
  <div>
    <button type="button" id="csv">Download CSV</button>
    <button type="button" class="secondary" id="json">Download JSON</button>
  </div>
  <p id="err" class="err"></p>
  <script>
    const err = document.getElementById('err')
    const keyInput = document.getElementById('key')
    async function download(format) {
      err.textContent = ''
      const key = keyInput.value.trim()
      if (!key) { err.textContent = '请填写 Admin API Key'; return }
      try {
        const res = await fetch('/api/quotes?format=' + format + '&limit=2000', {
          headers: { Authorization: 'Bearer ' + key }
        })
        if (!res.ok) {
          const data = await res.json().catch(() => ({}))
          throw new Error(data.error || ('HTTP ' + res.status))
        }
        const blob = await res.blob()
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = format === 'csv'
          ? 'zzsky-quotes.csv'
          : 'zzsky-quotes.json'
        a.click()
        URL.revokeObjectURL(a.href)
      } catch (e) {
        err.textContent = e.message || String(e)
      }
    }
    document.getElementById('csv').onclick = () => download('csv')
    document.getElementById('json').onclick = () => download('json')
  </script>
</body>
</html>
